          <use href="#botanical-flower-full" transform="translate(258, 94) scale(1.3) rotate(-12)" />
          <use href="#botanical-flower-profile" transform="translate(278, 80) scale(1.05) rotate(42)" />
          <use href="#botanical-flower-full" transform="translate(296, 66) scale(1.0) rotate(28)" />
          <use href="#botanical-flower-full" transform="translate(340, 80) scale(1.1) rotate(-20)" />
          <use href="#botanical-flower-full" transform="translate(426, 126) scale(1.2) rotate(8)" />
          <use href="#botanical-flower-profile" transform="translate(168, 146) scale(1.1) rotate(-35)" />
