<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" preserveAspectRatio="xMidYMid slice" width="100%" height="100%"><style id="sakura-embedded-style">
    /* TabFlow notu: Bu görsel bilerek durağandır. Chrome, içinde animasyon bildirilen bir SVG
       görselini her karede baştan çizer; arka plan için bu sürekli işlemci yükü demektir.
       Düşen yapraklar uygulamada ayrı, GPU'da taşınan öğelerle çizilir (canvas-scene.css). */
    /* ==========================================================
       SAF BOTANİK SAKURA ÖZELLEŞTİRİLEBİLİR DEĞİŞKENLER
       ========================================================== */
    :root {
      --dof-opacity: 0.20;
      --fg-branch-opacity: 1.00;
      --bark-rim-opacity: 0.33;
      --foliage-opacity: 0.96;
      --micro-detail-opacity: 1.00;

      /* Gerçekçi Dal &amp; Kabuk Paleti */
      --bark-deepest: #2b1d1a;
      --bark-core: #3d2a25;
      --bark-mid: #574039;
      --bark-grain: #735b52;
      --bark-highlight: #ecd9d2;
      --bark-rim-warm: #fff8f5;

      /* Botanik Sakura Çiçek &amp; Stamen Paleti */
      --petal-ao-shadow: #c27d99;
      --petal-deep: #db93b0;
      --petal-mid: #f4bfd4;
      --petal-soft: #fce7f3;
      --petal-light: #fff5f9;
      --petal-pure: #ffffff;
      --calyx-color: #3f6212;
      --stamen-filament: #fed7aa;
      --anther-gold: #facc15;
      overflow: hidden;
    }

    /* Katman Görünürlük Kontrolleri */
    .layer-dof-bokeh {
      opacity: var(--dof-opacity);
      transition: opacity 0.35s ease;
    }
    .layer-mid-foliage {
      opacity: var(--foliage-opacity);
      transition: opacity 0.35s ease;
    }
    .layer-fg-skeleton {
      opacity: var(--fg-branch-opacity);
      transition: opacity 0.35s ease;
    }
    .bark-rim-highlight {
      opacity: var(--bark-rim-opacity);
      transition: opacity 0.35s ease;
    }
    .layer-micro-details {
      opacity: var(--micro-detail-opacity);
      transition: opacity 0.35s ease;
    }

  </style>

  
  <defs>
    
    <filter id="dof-bokeh-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5.5" />
    </filter>

    <filter id="soft-canopy-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <linearGradient id="bark-sculpted-grad" x1="0%" y1="0%" x2="25%" y2="100%">
      <stop offset="0%" stop-color="var(--bark-deepest)" />
      <stop offset="52%" stop-color="var(--bark-core)" />
      <stop offset="88%" stop-color="var(--bark-mid)" />
      <stop offset="100%" stop-color="var(--bark-grain)" />
    </linearGradient>

    <linearGradient id="bark-rim-grad" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="var(--bark-rim-warm)" stop-opacity="0.95" />
      <stop offset="55%" stop-color="var(--bark-highlight)" stop-opacity="0.75" />
      <stop offset="100%" stop-color="var(--petal-deep)" stop-opacity="0.15" />
    </linearGradient>

    
    <linearGradient id="cluster-ao-grad" x1="20%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="var(--petal-ao-shadow)" />
      <stop offset="100%" stop-color="var(--petal-deep)" />
    </linearGradient>

    <linearGradient id="cluster-mid-grad" x1="15%" y1="95%" x2="85%" y2="5%">
      <stop offset="0%" stop-color="var(--petal-deep)" />
      <stop offset="48%" stop-color="var(--petal-mid)" />
      <stop offset="100%" stop-color="var(--petal-soft)" />
    </linearGradient>

    <linearGradient id="cluster-soft-grad" x1="40%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="var(--petal-mid)" />
      <stop offset="40%" stop-color="var(--petal-soft)" />
      <stop offset="85%" stop-color="var(--petal-light)" />
      <stop offset="100%" stop-color="var(--petal-pure)" />
    </linearGradient>

    <linearGradient id="cluster-crown-grad" x1="0%" y1="85%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--petal-light)" />
      <stop offset="65%" stop-color="var(--petal-pure)" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <radialGradient id="single-petal-grad" cx="50%" cy="85%" r="85%">
      <stop offset="0%" stop-color="var(--petal-deep)" stop-opacity="0.65" />
      <stop offset="32%" stop-color="var(--petal-soft)" />
      <stop offset="78%" stop-color="var(--petal-pure)" />
      <stop offset="100%" stop-color="#ffffff" />
    </radialGradient>

    
    
    <g id="botanical-cluster-lg">
      
      <path d="M -86,18 C -98,4 -92,-16 -74,-22 C -70,-42 -46,-54 -24,-44 C -10,-62 22,-64 38,-46 C 58,-54 84,-38 82,-16 C 98,-6 96,18 78,28 C 68,44 42,48 24,38 C 6,52 -24,50 -38,38 C -60,46 -84,36 -86,18 Z" fill="url(#cluster-mid-grad)" />
      
      <path d="M -74,8 C -82,-6 -72,-24 -54,-26 C -46,-44 -20,-48 -4,-36 C 12,-52 38,-50 48,-32 C 68,-36 82,-18 72,2 C 80,16 64,30 46,24 C 30,36 8,34 -6,24 C -24,36 -50,32 -60,18 C -70,22 -76,16 -74,8 Z" fill="url(#cluster-soft-grad)" />
      
      <path d="M -56,-12 C -60,-24 -46,-36 -32,-32 C -22,-46 2,-48 14,-34 C 28,-44 50,-38 54,-22 C 66,-22 70,-8 58,0 C 46,-8 30,-6 18,-14 C 4,-6 -14,-8 -26,-16 C -38,-8 -52,-6 -56,-12 Z" fill="url(#cluster-crown-grad)" opacity="0.95" />
      
      <g fill="var(--petal-pure)" opacity="0.9">
        <path d="M -46,-20 C -50,-28 -42,-34 -36,-28 C -32,-34 -24,-28 -28,-20 Z" />
        <path d="M -14,-30 C -18,-38 -10,-44 -4,-38 C 0,-44 8,-38 4,-30 Z" />
        <path d="M 20,-26 C 16,-34 24,-40 30,-34 C 34,-40 42,-34 38,-26 Z" />
        <circle cx="-58" cy="-4" r="4.2" />
        <circle cx="50" cy="-12" r="4.5" />
        <circle cx="8" cy="-18" r="5" />
      </g>
      
      <g fill="var(--petal-ao-shadow)" opacity="0.55">
        <circle cx="-36" cy="-18" r="2.2" />
        <circle cx="-4" cy="-26" r="2.4" />
        <circle cx="28" cy="-22" r="2.2" />
        <circle cx="-22" cy="14" r="3.5" />
        <circle cx="18" cy="18" r="3.8" />
        <circle cx="44" cy="10" r="3.2" />
      </g>
    </g>

    
    <g id="botanical-cluster-md">
      <path d="M -54,12 C -62,0 -56,-16 -40,-20 C -34,-36 -10,-40 4,-28 C 20,-40 42,-34 46,-16 C 60,-10 58,12 44,20 C 32,32 10,32 -4,22 C -22,32 -46,26 -54,12 Z" fill="url(#cluster-mid-grad)" />
      <path d="M -42,2 C -48,-10 -38,-22 -24,-22 C -14,-34 8,-34 18,-22 C 32,-26 46,-14 40,2 C 28,12 12,10 0,4 C -14,12 -32,12 -42,2 Z" fill="url(#cluster-soft-grad)" />
      <path d="M -30,-10 C -32,-20 -18,-28 -6,-22 C 4,-32 22,-28 26,-16 C 34,-16 36,-6 26,-2 C 14,-8 2,-6 -8,-12 C -18,-6 -28,-4 -30,-10 Z" fill="url(#cluster-crown-grad)" opacity="0.92" />
      <g fill="var(--petal-ao-shadow)" opacity="0.5">
        <circle cx="-14" cy="-12" r="2" />
        <circle cx="14" cy="-10" r="2.2" />
        <circle cx="4" cy="10" r="2.8" />
      </g>
    </g>

    
    <g id="botanical-cluster-sm">
      <path d="M -30,6 C -36,-4 -28,-16 -16,-16 C -8,-26 10,-26 16,-16 C 28,-16 34,-2 26,8 C 18,18 4,18 -4,12 C -14,18 -26,14 -30,6 Z" fill="url(#cluster-soft-grad)" />
      <path d="M -20,-4 C -22,-12 -10,-18 -2,-14 C 6,-20 16,-16 18,-6 C 8,-4 -8,-2 -20,-4 Z" fill="url(#cluster-crown-grad)" opacity="0.95" />
      <circle cx="-2" cy="-4" r="1.8" fill="var(--petal-ao-shadow)" opacity="0.55" />
    </g>

    
    
    <path id="notched-sakura-petal" d="M 0,0 C -4.5,-4.5 -8.5,-12.5 -4.2,-17.5 C -2.4,-19.5 -0.8,-17.2 0,-15.2 C 0.8,-17.2 2.4,-19.5 4.2,-17.5 C 8.5,-12.5 4.5,-4.5 0,0 Z" />

    
    <g id="botanical-flower-full">
      
      <g fill="url(#single-petal-grad)" stroke="var(--petal-mid)" stroke-width="0.35">
        <use href="#notched-sakura-petal" />
        <use href="#notched-sakura-petal" transform="rotate(72)" />
        <use href="#notched-sakura-petal" transform="rotate(144)" />
        <use href="#notched-sakura-petal" transform="rotate(216)" />
        <use href="#notched-sakura-petal" transform="rotate(288)" />
      </g>
      
      <circle cx="0" cy="0" r="3.4" fill="var(--petal-deep)" opacity="0.7" />
      
      <g stroke="var(--stamen-filament)" stroke-width="0.45" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-6.2" />
        <line x1="0" y1="0" x2="3.8" y2="-4.8" />
        <line x1="0" y1="0" x2="6.0" y2="-1.5" />
        <line x1="0" y1="0" x2="5.2" y2="3.2" />
        <line x1="0" y1="0" x2="2.2" y2="5.8" />
        <line x1="0" y1="0" x2="-2.2" y2="5.8" />
        <line x1="0" y1="0" x2="-5.2" y2="3.2" />
        <line x1="0" y1="0" x2="-6.0" y2="-1.5" />
        <line x1="0" y1="0" x2="-3.8" y2="-4.8" />
      </g>
      
      <g fill="var(--anther-gold)">
        <circle cx="0" cy="-6.2" r="0.85" />
        <circle cx="3.8" cy="-4.8" r="0.75" />
        <circle cx="6.0" cy="-1.5" r="0.85" />
        <circle cx="5.2" cy="3.2" r="0.75" />
        <circle cx="2.2" cy="5.8" r="0.85" />
        <circle cx="-2.2" cy="5.8" r="0.75" />
        <circle cx="-5.2" cy="3.2" r="0.85" />
        <circle cx="-6.0" cy="-1.5" r="0.75" />
        <circle cx="-3.8" cy="-4.8" r="0.85" />
      </g>
      <circle cx="0" cy="0" r="1.2" fill="#fffdf5" />
    </g>

    
    <g id="botanical-flower-profile">
      
      <path d="M 0,9 C 0,5 0,2 0,0" stroke="var(--calyx-color)" stroke-width="1.3" fill="none" stroke-linecap="round" />
      
      <path d="M 0,-2 C -7,-7 -9,-15 -4,-18 C -1,-19 0,-15 0,-12 C 1,-16 4,-19 6,-17 C 10,-13 6,-6 0,-2 Z" fill="var(--petal-soft)" />
      
      <path d="M 0,-1 C -8,-4 -11,-11 -7,-15 C -4,-17 -1,-13 0,-10 C 2,-13 5,-16 8,-14 C 11,-10 7,-3 0,-1 Z" fill="url(#single-petal-grad)" />
      
      <path d="M -1,-9 L -3,-16 M 1,-9 L 3,-17 M 0,-9 L 0,-18" stroke="var(--stamen-filament)" stroke-width="0.45" />
      <circle cx="-3" cy="-16" r="0.75" fill="var(--anther-gold)" />
      <circle cx="3" cy="-17" r="0.75" fill="var(--anther-gold)" />
      <circle cx="0" cy="-18" r="0.8" fill="var(--anther-gold)" />
      
      <path d="M -3.5,-1.5 C -2,1.5 -1,3.5 0,4.5 C 1,3.5 2,1.5 3.5,-1.5 L 1.8,-2.5 L 0,-1 L -1.8,-2.5 Z" fill="var(--calyx-color)" />
    </g>

    
    <g id="botanical-bud">
      <path d="M 0,6 L 0,0" stroke="var(--calyx-color)" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 0,0 C -3.8,-3.5 -4.2,-10.5 0,-14 C 4.2,-10.5 3.8,-3.5 0,0 Z" fill="var(--petal-mid)" />
      <path d="M 0,-2 C -2.4,-5.5 -2.4,-10.5 0,-13.2 C 2.4,-10.5 2.4,-5.5 0,-2 Z" fill="var(--petal-light)" />
      
      <path d="M -2.8,-0.5 C -1.5,-3.5 0,-4.5 0,-1.5 C 0,-4.5 1.5,-3.5 2.8,-0.5 C 1.5,1.5 -1.5,1.5 -2.8,-0.5 Z" fill="var(--calyx-color)" />
    </g>

  </defs>

  
  <g id="sakura-directional-root" transform="translate(0, 0) scale(1, 1)">

    
    <g class="kinematic-bough-lower">
      <path d="M -30,698                 C 30,656 84,596 148,562                 C 206,532 268,528 328,504                 C 378,484 422,454 474,440                 C 424,464 382,496 332,518                 C 368,530 412,534 454,526                 C 410,544 362,544 318,526                 C 265,546 212,554 162,584                 C 198,596 242,600 288,590                 C 242,610 195,610 152,594                 C 95,626 40,688 -30,748 Z" fill="url(#bark-sculpted-grad)" />

      
      <g class="kinematic-sub-branch">
        <path d="M 154,588 C 184,625 228,648 280,655 C 225,656 180,635 144,595 Z" fill="url(#bark-sculpted-grad)" />
        <path d="M 218,546 C 258,510 295,480 346,466 C 298,486 262,516 228,550 Z" fill="url(#bark-sculpted-grad)" />
      </g>

      
      <path class="bark-rim-highlight" d="M -20,740 C 42,682 95,624 152,592 C 195,608 240,608 285,590" fill="none" stroke="url(#bark-rim-grad)" stroke-width="3.0" stroke-linecap="round" />
      <path class="bark-rim-highlight" d="M 162,582 C 212,552 265,544 318,524 C 362,540 408,540 450,526" fill="none" stroke="url(#bark-rim-grad)" stroke-width="2.0" stroke-linecap="round" />
    </g>

    
    <g id="layer-mid-blossoms" class="layer-mid-foliage">
      
      <g class="kinematic-bough-lower">
        <use href="#botanical-cluster-md" transform="translate(54, 442) scale(1.06)" />
        <use href="#botanical-cluster-md" transform="translate(262, 464) scale(1.02)" />
        <use href="#botanical-cluster-sm" transform="translate(382, 426) scale(1.12)" />
        <use href="#botanical-cluster-sm" transform="translate(462, 446) scale(0.95)" />
        <use href="#botanical-cluster-sm" transform="translate(334, 534) scale(0.92)" />
        <use href="#botanical-cluster-sm" transform="translate(204, 596) scale(0.86)" />
      </g>
    </g>

    
    <g id="layer-foreground-branches" class="layer-fg-skeleton">
      
      <g class="kinematic-bough-lower" stroke="var(--bark-deepest)" stroke-linecap="round" fill="none">
        <g class="kinematic-sub-branch">
          <path d="M 114,612 C 158,578 205,562 258,558" stroke-width="4.2" />
          <path d="M 202,568 C 235,544 272,538 308,542" stroke-width="2.6" />
          <path d="M 258,558 C 292,554 325,568 352,584" stroke-width="1.8" />
          <path d="M 318,526 C 355,504 395,494 435,498" stroke-width="2.8" />
          <path d="M 378,502 C 408,488 438,484 468,492" stroke-width="1.8" />
        </g>
      </g>
    </g>

    
    <g id="layer-botanical-details" class="layer-micro-details">
      <g class="kinematic-bough-mid">
        
        <g class="kinematic-twig-tip-delayed">
          
          <use href="#botanical-flower-full" transform="translate(258, 558) scale(1.25) rotate(10)" />
          <use href="#botanical-flower-profile" transform="translate(284, 548) scale(1.1) rotate(48)" />
          <use href="#botanical-flower-full" transform="translate(308, 542) scale(1.05) rotate(-28)" />
          <use href="#botanical-flower-full" transform="translate(352, 584) scale(0.95) rotate(15)" />
          <use href="#botanical-flower-full" transform="translate(435, 498) scale(1.15) rotate(-10)" />
          <use href="#botanical-flower-full" transform="translate(468, 492) scale(0.9) rotate(30)" />
          <use href="#botanical-flower-full" transform="translate(280, 655) scale(1.0) rotate(-15)" />
          <use href="#botanical-flower-profile" transform="translate(228, 638) scale(1.0) rotate(130)" />
          <use href="#botanical-bud" transform="translate(295, 658) rotate(96)" />
          <use href="#botanical-bud" transform="translate(484, 495) rotate(82)" />
          <use href="#botanical-bud" transform="translate(366, 592) rotate(118)" />
        </g>
      </g>
    </g>


  </g>
</svg>
