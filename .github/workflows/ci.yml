name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tip kontrolü
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Birim testleri
        run: npm test
      - name: Derleme
        run: npm run build
      - name: Chromium kur
        run: npx playwright install --with-deps chromium
      - name: Uçtan uca testler
        run: npx playwright test
      - name: Test raporunu sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
